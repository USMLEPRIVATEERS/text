<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Documentos</title>
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --accent-hover: #ff6b81;
      --text: #eee;
      --text-muted: #999;
      --border: #2a2a4a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: transform 0.3s;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .btn-new {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-new:hover { background: var(--accent-hover); }

    .doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .doc-item {
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .doc-item:hover { background: var(--surface2); }
    .doc-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }

    .doc-item-info { flex: 1; min-width: 0; }

    .doc-item-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-item-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }

    .doc-item:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { color: var(--accent); }

    /* Main editor area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
    }

    .toolbar-area {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-menu {
      display: none;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }

    .title-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 20px;
      font-weight: 600;
      outline: none;
      flex: 1;
      min-width: 0;
    }

    .title-input::placeholder { color: var(--text-muted); }

    .save-status {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .save-status.saving { color: var(--accent); }
    .save-status.saved { color: #4ade80; }

    .editor-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Quill styling overrides */
    #editor-container {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
    }

    .ql-toolbar.ql-snow {
      background: var(--surface);
      border: none !important;
      border-bottom: 1px solid var(--border) !important;
    }

    .ql-snow .ql-stroke { stroke: var(--text-muted) !important; }
    .ql-snow .ql-fill { fill: var(--text-muted) !important; }
    .ql-snow .ql-picker-label { color: var(--text-muted) !important; }
    .ql-snow .ql-picker-options {
      background: var(--surface) !important;
      border-color: var(--border) !important;
    }
    .ql-snow .ql-picker-item { color: var(--text-muted) !important; }
    .ql-snow .ql-active .ql-stroke { stroke: var(--accent) !important; }
    .ql-snow .ql-active .ql-fill { fill: var(--accent) !important; }
    .ql-snow .ql-active { color: var(--accent) !important; }

    .ql-container.ql-snow {
      border: none !important;
      font-size: 16px;
    }

    .ql-editor {
      color: var(--text);
      padding: 30px 50px;
      line-height: 1.8;
      min-height: 100%;
    }

    .ql-editor.ql-blank::before {
      color: var(--text-muted) !important;
      font-style: normal !important;
    }

    .ql-snow a { color: var(--accent) !important; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    .empty-state p {
      font-size: 16px;
      margin-bottom: 16px;
    }

    /* Overlay for mobile */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9;
    }

    .overlay.show { display: block; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        z-index: 10;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .btn-menu { display: block; }
      .ql-editor { padding: 20px; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Documentos</h1>
      <button class="btn-new" onclick="createDoc()">+ Novo</button>
    </div>
    <div class="doc-list" id="docList">
      <div class="loading"><div class="spinner"></div> Carregando...</div>
    </div>
  </aside>

  <main class="main" id="mainArea">
    <div class="toolbar-area" id="toolbarArea">
      <button class="btn-menu" onclick="toggleSidebar()">&#9776;</button>
      <input type="text" class="title-input" id="titleInput" placeholder="Título do documento..." disabled>
      <span class="save-status" id="saveStatus"></span>
    </div>
    <div class="editor-wrapper" id="editorWrapper">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <p>Selecione ou crie um documento</p>
        <button class="btn-new" onclick="createDoc()">+ Novo Documento</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ---- Config ----
    const SUPABASE_URL = 'https://awtjzgqiinxddyxyslqj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3dGp6Z3FpaW54ZGR5eHlzbHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNjg4ODEsImV4cCI6MjA4Njk0NDg4MX0.HE-t4ReI3VWv5GKw1-t1pkkuqtAjdA4jJ2fnQZBXy5s';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---- State ----
    let currentDocId = null;
    let quill = null;
    let saveTimeout = null;
    let docs = [];

    // ---- Quill Init ----
    function initQuill() {
      if (quill) return;

      // Remove empty state, create editor container
      const emptyState = document.getElementById('emptyState');
      if (emptyState) emptyState.remove();

      const wrapper = document.getElementById('editorWrapper');
      const container = document.createElement('div');
      container.id = 'editor-container';
      wrapper.appendChild(container);

      quill = new Quill('#editor-container', {
        theme: 'snow',
        placeholder: 'Comece a escrever...',
        modules: {
          toolbar: [
            [{ header: [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ color: [] }, { background: [] }],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['blockquote', 'code-block'],
            ['link'],
            ['clean']
          ]
        }
      });

      quill.on('text-change', () => {
        if (!currentDocId) return;
        showStatus('saving');
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveDoc, 800);
      });
    }

    // ---- Supabase Operations ----
    async function loadDocs() {
      const { data, error } = await supabase
        .from('documents')
        .select('id, title, updated_at')
        .order('updated_at', { ascending: false });

      if (error) {
        console.error('Erro ao carregar documentos:', error);
        document.getElementById('docList').innerHTML =
          '<div style="padding:20px;color:var(--text-muted);font-size:13px;">Erro ao carregar. Verifique se a tabela foi criada executando o setup.sql no Supabase.</div>';
        return;
      }

      docs = data || [];
      renderDocList();
    }

    async function createDoc() {
      const { data, error } = await supabase
        .from('documents')
        .insert({ title: 'Sem título', content: '' })
        .select()
        .single();

      if (error) {
        alert('Erro ao criar documento: ' + error.message);
        return;
      }

      docs.unshift({ id: data.id, title: data.title, updated_at: data.updated_at });
      renderDocList();
      openDoc(data.id);
      closeSidebarMobile();
    }

    async function openDoc(id) {
      currentDocId = id;

      const { data, error } = await supabase
        .from('documents')
        .select('*')
        .eq('id', id)
        .single();

      if (error) {
        alert('Erro ao abrir documento: ' + error.message);
        return;
      }

      initQuill();

      const titleInput = document.getElementById('titleInput');
      titleInput.value = data.title;
      titleInput.disabled = false;

      // Load content - try parsing as Delta JSON, fallback to plain text
      try {
        const delta = JSON.parse(data.content);
        quill.setContents(delta);
      } catch {
        quill.setText(data.content || '');
      }

      quill.focus();
      renderDocList();
      showStatus('saved');
      closeSidebarMobile();
    }

    async function saveDoc() {
      if (!currentDocId || !quill) return;

      const title = document.getElementById('titleInput').value || 'Sem título';
      const content = JSON.stringify(quill.getContents());

      const { error } = await supabase
        .from('documents')
        .update({ title, content })
        .eq('id', currentDocId);

      if (error) {
        showStatus('error');
        console.error('Erro ao salvar:', error);
        return;
      }

      // Update local list
      const doc = docs.find(d => d.id === currentDocId);
      if (doc) {
        doc.title = title;
        doc.updated_at = new Date().toISOString();
      }
      renderDocList();
      showStatus('saved');
    }

    async function deleteDoc(id, e) {
      e.stopPropagation();
      if (!confirm('Excluir este documento?')) return;

      const { error } = await supabase
        .from('documents')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Erro ao excluir: ' + error.message);
        return;
      }

      docs = docs.filter(d => d.id !== id);

      if (currentDocId === id) {
        currentDocId = null;
        if (quill) {
          quill.setText('');
          document.getElementById('titleInput').value = '';
          document.getElementById('titleInput').disabled = true;
        }
      }

      renderDocList();
    }

    // ---- UI Rendering ----
    function renderDocList() {
      const list = document.getElementById('docList');

      if (docs.length === 0) {
        list.innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:13px;text-align:center;">Nenhum documento ainda.<br>Clique em "+ Novo" para criar.</div>';
        return;
      }

      list.innerHTML = docs.map(doc => {
        const date = new Date(doc.updated_at);
        const fmt = date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        return `
          <div class="doc-item ${doc.id === currentDocId ? 'active' : ''}" onclick="openDoc('${doc.id}')">
            <div class="doc-item-info">
              <div class="doc-item-title">${escapeHtml(doc.title)}</div>
              <div class="doc-item-date">${fmt}</div>
            </div>
            <button class="btn-delete" onclick="deleteDoc('${doc.id}', event)" title="Excluir">&#10005;</button>
          </div>
        `;
      }).join('');
    }

    function showStatus(state) {
      const el = document.getElementById('saveStatus');
      el.className = 'save-status ' + state;
      if (state === 'saving') el.textContent = 'Salvando...';
      else if (state === 'saved') el.textContent = 'Salvo';
      else if (state === 'error') el.textContent = 'Erro ao salvar';
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ---- Title auto-save ----
    let titleTimeout = null;
    document.getElementById('titleInput').addEventListener('input', () => {
      clearTimeout(titleTimeout);
      showStatus('saving');
      titleTimeout = setTimeout(saveDoc, 800);
    });

    // ---- Sidebar mobile toggle ----
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }

    function closeSidebarMobile() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    // ---- Keyboard shortcut ----
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        clearTimeout(saveTimeout);
        saveDoc();
      }
    });

    // ---- Init ----
    loadDocs();
  </script>
</body>
</html>
